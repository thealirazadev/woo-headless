name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      WOOCOMMERCE_STORE_URL: https://store.example.com
      WOOCOMMERCE_CONSUMER_KEY: ck_0000000000000000000000000000000000000000
      WOOCOMMERCE_CONSUMER_SECRET: cs_0000000000000000000000000000000000000000
      NEXT_PUBLIC_STORE_NAME: Example Store
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

